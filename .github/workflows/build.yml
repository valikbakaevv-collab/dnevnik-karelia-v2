          B64
          tar xzf p.tgz -C src
          mkdir -p src/diary/android/app/src/main/assets
          cp src/diary/site/index.html src/diary/android/app/src/main/assets/index.html

      - name: Prepare signing key
        env:
          KS: ${{ secrets.OZM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/ozm.jks"
            echo "OZM_KEYSTORE=$RUNNER_TEMP/ozm.jks" >> "$GITHUB_ENV"
            echo "::notice::APK подписывается постоянным ключом РБ СЭМП"
          else
            echo "::warning::Ключ подписи не задан: APK подписан временным ключом (для установки подходит, для RuStore нет)"
          fi

      - name: Build APK
        working-directory: src/diary/android
        env:
          OZM_KEYSTORE_PASSWORD: ${{ secrets.OZM_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK and site
        run: |
          mkdir -p site
          cp -r src/diary/site/. site/
          cp src/diary/android/app/build/outputs/apk/release/app-release.apk Dnevnik-Karelia.apk
          cp Dnevnik-Karelia.apk site/Dnevnik-Karelia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Dnevnik-Karelia-apk
          path: Dnevnik-Karelia.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Дневник мочеиспусканий Карелия 1.0 (сборка ${{ github.run_number }})
          body: Dnevnik-Karelia.apk для Android 8.0+. РБ СЭМП. Разработчик — врач-уролог Бакаев В. А.
          files: Dnevnik-Karelia.apk
          make_latest: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
